---
- name: Verify supported OS family
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: The baseline supports Debian/Ubuntu and RedHat-family systems including AL2023.

- name: Refresh Debian package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Include sshd hardening
  ansible.builtin.import_tasks: sshd.yml
  when: cis_baseline_harden_sshd
  tags: [sshd]

- name: Include auditd hardening
  ansible.builtin.import_tasks: auditd.yml
  when: cis_baseline_harden_auditd
  tags: [auditd]

- name: Include fail2ban hardening
  ansible.builtin.import_tasks: fail2ban.yml
  when: cis_baseline_harden_fail2ban and ansible_facts['os_family'] == 'Debian'
  tags: [fail2ban]

- name: Include sysctl hardening
  ansible.builtin.import_tasks: sysctl.yml
  when: cis_baseline_harden_sysctl
  tags: [sysctl]

- name: Include pam and password policy
  ansible.builtin.import_tasks: pam.yml
  when: cis_baseline_harden_pam
  tags: [pam]

- name: Include filesystem module hardening
  ansible.builtin.import_tasks: filesystem.yml
  when: cis_baseline_harden_filesystem
  tags: [filesystem]
