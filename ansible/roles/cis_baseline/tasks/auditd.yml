---
- name: Install auditd
  ansible.builtin.package:
    name: "{{ ['auditd', 'audispd-plugins'] if ansible_facts['os_family'] == 'Debian' else ['audit'] }}"
    state: present

- name: Ensure watched log files exist before loading audit rules
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: root
    group: root
    mode: "0600"
  loop:
    - /var/log/faillog
    - /var/log/lastlog
    - /var/log/sudo.log
    - /var/log/btmp
    - /var/log/wtmp

- name: Deploy baseline audit rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/60-hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Enable and start auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: cis_baseline_apply_runtime
