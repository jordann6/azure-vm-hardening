---
- name: Install auditd
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    update_cache: true

- name: Deploy baseline audit rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/60-hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Enable and start auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: cis_baseline_apply_runtime
