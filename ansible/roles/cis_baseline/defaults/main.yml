---
# cis_baseline role defaults
# Every control is toggleable so the role stays reusable across hosts.

# When false, the role writes config files but skips steps that touch the live
# kernel or services (sysctl --system, service restarts). Molecule sets this
# false so the role can be verified inside a container; the Packer bake and the
# real jump host both run with it true.
cis_baseline_apply_runtime: true

# --- sshd ---
cis_baseline_harden_sshd: true
cis_baseline_sshd_permit_root_login: "no"
cis_baseline_sshd_password_authentication: "no"
cis_baseline_sshd_max_auth_tries: 4
cis_baseline_sshd_login_grace_time: 30
cis_baseline_sshd_client_alive_interval: 300
cis_baseline_sshd_client_alive_count_max: 2
cis_baseline_sshd_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com"
cis_baseline_sshd_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com"
cis_baseline_sshd_kex: "curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512"

# --- auditd ---
cis_baseline_harden_auditd: true

# --- fail2ban ---
cis_baseline_harden_fail2ban: true
cis_baseline_fail2ban_bantime: 3600
cis_baseline_fail2ban_findtime: 600
cis_baseline_fail2ban_maxretry: 5

# --- sysctl ---
cis_baseline_harden_sysctl: true

# --- pam / password policy ---
cis_baseline_harden_pam: true
cis_baseline_pam_minlen: 14
cis_baseline_pam_pass_max_days: 90
cis_baseline_pam_pass_min_days: 1
cis_baseline_pam_pass_warn_age: 7
cis_baseline_login_umask: "027"

# --- filesystem modules ---
cis_baseline_harden_filesystem: true
cis_baseline_blacklisted_filesystems:
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - udf
