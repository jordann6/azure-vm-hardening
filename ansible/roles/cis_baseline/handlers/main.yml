---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: restarted
  when: cis_baseline_apply_runtime

- name: Restart auditd
  # AL2023 refuses manual systemd restarts; the service wrapper is supported.
  ansible.builtin.command: service auditd restart # noqa: command-instead-of-module
  changed_when: true
  when: cis_baseline_apply_runtime

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: cis_baseline_apply_runtime

- name: Reload sysctl
  ansible.builtin.command: sysctl --system  # noqa: command-instead-of-module
  when: cis_baseline_apply_runtime
  changed_when: false
