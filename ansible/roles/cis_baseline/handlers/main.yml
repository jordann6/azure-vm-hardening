---
- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: harden_apply_runtime

- name: Restart auditd
  # auditd does not support the standard systemd restart cleanly; use service tooling.
  ansible.builtin.command: service auditd restart
  when: harden_apply_runtime
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: harden_apply_runtime

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  when: harden_apply_runtime
  changed_when: false
