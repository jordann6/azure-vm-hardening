---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install openssh-server for sshd config validation
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true

    - name: Create sshd privilege separation directory
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create modprobe.d directory
      ansible.builtin.file:
        path: /etc/modprobe.d
        state: directory
        owner: root
        group: root
        mode: "0755"
